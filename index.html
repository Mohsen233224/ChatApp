<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Water System Ultimate</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#dfefff;
min-height:100vh;
overflow-x:hidden;
display:flex;
justify-content:center;
align-items:center;
transition:.3s;
}

.app{
width:100%;
max-width:430px;
min-height:100vh;
background:#f7fbff;
position:relative;
overflow:hidden;
margin:auto;
}

.page{
position:absolute;
inset:0;
display:none;
overflow-y:auto;
padding-bottom:120px;
background:#f7fbff;
width:100%;
}

.page.active{
display:block;
}

.top{
min-height:290px;
background:linear-gradient(135deg,#0077ff,#00bfff);
border-bottom-left-radius:40px;
border-bottom-right-radius:40px;
padding:25px 20px 110px;
position:relative;
overflow:hidden;
}

.top::before{
content:'';
position:absolute;
width:320px;
height:320px;
border-radius:50%;
background:rgba(255,255,255,.08);
top:-150px;
left:-100px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
position:relative;
z-index:2;
}

.profile{
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
background:white;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
color:#0077ff;
}

.user h2{
color:white;
font-size:18px;
}

.user p{
color:rgba(255,255,255,.8);
font-size:13px;
margin-top:4px;
}

.header-icons{
display:flex;
gap:10px;
}

.notify{
width:48px;
height:48px;
border-radius:16px;
background:rgba(255,255,255,.18);
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
color:white;
backdrop-filter:blur(10px);
cursor:pointer;
}

.balance-card{
position:absolute;
left:20px;
right:20px;
bottom:-70px;
background:white;
border-radius:30px;
min-height:185px;
box-shadow:0 20px 40px rgba(0,0,0,.08);
z-index:5;
padding:20px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.balance-card h1{
font-size:clamp(32px,6vw,42px);
color:#17324f;
margin-top:10px;
}

.balance-card span{
color:#718191;
font-size:14px;
}

.pay-btn{
padding:14px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#0077ff,#00bfff);
color:white;
font-weight:bold;
cursor:pointer;
width:100%;
margin-top:20px;
font-size:15px;
}

.content{
padding:120px 20px 20px;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(95px,1fr));
gap:15px;
}

.service{
background:white;
padding:18px 10px;
border-radius:26px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.05);
cursor:pointer;
transition:.3s;
min-height:130px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.service:hover{
transform:translateY(-4px);
}

.service-icon{
width:60px;
height:60px;
border-radius:20px;
background:#eef7ff;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
margin-bottom:12px;
}

.service span{
font-size:14px;
font-weight:700;
color:#17324f;
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin:30px 0 18px;
}

.section-title h3{
color:#17324f;
}

.card{
background:white;
padding:18px;
border-radius:24px;
margin-bottom:15px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.card h4{
color:#17324f;
margin-bottom:6px;
}

.card p{
color:#718191;
font-size:13px;
}

.input{
width:100%;
padding:15px;
border:none;
background:#f3f7fb;
border-radius:18px;
margin-bottom:15px;
font-size:15px;
outline:none;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#0077ff,#00bfff);
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.bottom-nav{
position:fixed;
bottom:0;
width:100%;
max-width:430px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
padding:15px 0;
border-top-left-radius:30px;
border-top-right-radius:30px;
box-shadow:0 -10px 30px rgba(0,0,0,.08);
z-index:999;
left:50%;
transform:translateX(-50%);
}

.nav{
text-align:center;
font-size:12px;
color:#8291a0;
cursor:pointer;
}

.nav span{
font-size:24px;
display:block;
margin-bottom:3px;
}

.nav.active{
color:#0077ff;
font-weight:bold;
}

.center{
width:70px;
height:70px;
border-radius:50%;
background:linear-gradient(135deg,#0077ff,#00bfff);
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:36px;
margin-top:-10px;
box-shadow:0px 5px 10px #3383DF;
}

.toast{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#17324f;
color:white;
padding:14px 20px;
border-radius:16px;
display:none;
z-index:9999;
font-size:14px;
}

.bill{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:white;
border-radius:22px;
margin-bottom:12px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
gap:10px;
}

.dark{
background:#101927 !important;
}

.dark .page{
background:#101927;
}

.dark .card,
.dark .service,
.dark .balance-card,
.dark .bottom-nav,
.dark .bill{
background:#1b2838;
color:white;
}

.dark p,
.dark span,
.dark h3,
.dark h4{
color:#d3dce7 !important;
}

.dark .input{
background:#243548;
color:white;
}

@media (max-width:480px){

.content{
padding:120px 15px 20px;
}

.services{
grid-template-columns:repeat(2,1fr);
}

.balance-card{
left:15px;
right:15px;
}

}

</style>

</head>

<body>

<div class="app">

<div class="toast" id="toast">
تمت العملية
</div>

<div class="page active" id="homePage">

<div class="top">

<div class="header">

<div class="profile">

<div class="avatar">
M
</div>

<div class="user">

<h2 id="welcomeName">
مرحبا بك 👋
</h2>

<p>
المياه الوطنية
</p>

</div>

</div>

<div class="header-icons">

<div class="notify" onclick="showNotifications()">
🔔
</div>

<div class="notify" onclick="openPage('settingsPage')">
⚙️
</div>

</div>

</div>

<div class="balance-card">

<span>
إجمالي الفواتير
</span>

<h1 id="balance">
0 ر.س
</h1>

<button class="pay-btn" onclick="payAllBills()">
دفع جميع الفواتير
</button>

</div>

</div>

<div class="content">

<div class="services">

<div class="service" onclick="openPage('waterPage')">
<div class="service-icon">💧</div>
<span>طلب مياه</span>
</div>

<div class="service" onclick="openPage('billsPage')">
<div class="service-icon">🧾</div>
<span>الفواتير</span>
</div>

<div class="service" onclick="openPage('trackingPage')">
<div class="service-icon">📍</div>
<span>التتبع</span>
</div>

<div class="service" onclick="toggleDarkMode()">
<div class="service-icon">🌙</div>
<span>الوضع الداكن</span>
</div>

</div>

<div class="section-title">
<h3>
آخر الطلبات
</h3>
</div>

<div id="orders"></div>

</div>

</div>

<div class="page" id="waterPage">

<div class="content">

<div class="section-title">
<h3>
طلب مياه جديد
</h3>
</div>

<input type="text" class="input" id="location" placeholder="الموقع">

<input type="number" class="input" id="quantity" placeholder="عدد الجالونات">

<button class="btn" onclick="sendWaterOrder()">
إرسال الطلب
</button>

</div>

</div>

<div class="page" id="billsPage">

<div class="content">

<div class="section-title">
<h3>
الفواتير الحالية
</h3>
</div>

<div id="billsContainer"></div>

</div>

</div>

<div class="page" id="trackingPage">

<div class="content">

<div class="section-title">
<h3>
تتبع السيارة
</h3>
</div>

<div class="card">

<h4>
السائق قريب منك
</h4>

<p id="trackText">
يبعد 12 دقيقة
</p>

</div>

<button class="btn" onclick="fakeTracking()">
تحديث التتبع
</button>

</div>

</div>

<div class="page" id="settingsPage">

<div class="content">

<div class="section-title">
<h3>
الإعدادات
</h3>
</div>

<div class="card">

<h4 style="margin-bottom:15px;">
بياناتي
</h4>

<input type="text" class="input" id="userName" placeholder="اسمك">

<input type="text" class="input" id="userPhone" placeholder="رقم الجوال">

<input type="email" class="input" id="userEmail" placeholder="البريد الإلكتروني">

<button class="btn" onclick="saveUserData()">
حفظ البيانات
</button>

</div>

</div>

</div>

<div class="bottom-nav">

<div class="nav active" onclick="openPage('homePage',this)">
<span>🏠</span>
الرئيسية
</div>

<div class="nav" onclick="openPage('waterPage',this)">
<span>💧</span>
الطلبات
</div>

<div class="center">
+
</div>

<div class="nav" onclick="openPage('billsPage',this)">
<span>🧾</span>
الفواتير
</div>

<div class="nav" onclick="openPage('trackingPage',this)">
<span>📍</span>
التتبع
</div>

</div>

</div>

<script>

let totalBalance = 0;

let bills = JSON.parse(localStorage.getItem('bills')) || [];

function showToast(text){

const toast = document.getElementById('toast');

toast.innerText = text;

toast.style.display='block';

setTimeout(()=>{
toast.style.display='none';
},2000);

}

function openPage(pageId,el){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId).classList.add('active');

if(el){

document.querySelectorAll('.nav').forEach(nav=>{
nav.classList.remove('active');
});

el.classList.add('active');

}

}

function sendWaterOrder(){

const location =
document.getElementById('location').value;

const quantity =
document.getElementById('quantity').value;

if(location==='' || quantity===''){

showToast('أكمل البيانات');

return;

}

const price = quantity * 5;

const bill = {
id:Date.now(),
location,
quantity,
price,
paid:false
};

bills.push(bill);

localStorage.setItem('bills',JSON.stringify(bills));

renderBills();

const order =
document.createElement('div');

order.classList.add('card');

order.innerHTML=`

<h4>طلب مياه جديد</h4>

<p>
${location} - ${quantity} جالون
</p>

`;

document.getElementById('orders').prepend(order);

showToast('تم إنشاء فاتورة جديدة');

document.getElementById('location').value='';
document.getElementById('quantity').value='';

openPage('homePage');

}

function renderBills(){

const container =
document.getElementById('billsContainer');

container.innerHTML='';

totalBalance = 0;

bills.forEach((bill,index)=>{

if(!bill.paid){
totalBalance += bill.price;
}

const div =
document.createElement('div');

div.classList.add('bill');

div.innerHTML = `

<div>

<h4 style="margin-bottom:6px;">
🧾 فاتورة مياه
</h4>

<p>
📍 ${bill.location}
</p>

<p>
💧 ${bill.quantity} جالون
</p>

<p style="margin-top:8px;font-weight:bold;">
💰 ${bill.price} ر.س
</p>

</div>

<button
onclick="payBill(${index})"
style="
padding:10px 14px;
border:none;
border-radius:14px;
background:${bill.paid ? '#00a65a' : '#0077ff'};
color:white;
cursor:pointer;
"
${bill.paid ? 'disabled' : ''}
>

${bill.paid ? 'تم' : 'دفع'}

</button>

`;

container.appendChild(div);

});

document.getElementById('balance').innerText =
totalBalance + ' ر.س';

}

function payBill(index){

bills[index].paid = true;

localStorage.setItem('bills',JSON.stringify(bills));

renderBills();

showToast('تم دفع الفاتورة');

}

function payAllBills(){

bills.forEach(b=>{
b.paid = true;
});

localStorage.setItem('bills',JSON.stringify(bills));

renderBills();

showToast('تم دفع جميع الفواتير');

}

function fakeTracking(){

const mins =
Math.floor(Math.random()*10)+1;

document.getElementById('trackText').innerText =
'يبعد ' + mins + ' دقائق';

showToast('تم تحديث الموقع');

}

function toggleDarkMode(){

document.body.classList.toggle('dark');

showToast('تم تغيير الوضع');

}

function saveUserData(){

const name =
document.getElementById('userName').value;

localStorage.setItem('userName',name);

document.getElementById('welcomeName').innerText =
'مرحبا ' + name + ' 👋';

showToast('تم حفظ البيانات');

}

window.onload = ()=>{

renderBills();

const savedName =
localStorage.getItem('userName');

if(savedName){

document.getElementById('userName').value =
savedName;

document.getElementById('welcomeName').innerText =
'مرحبا ' + savedName + ' 👋';

}

}

function showNotifications(){

showToast('لا توجد إشعارات جديدة');

}

</script>

</body>
</html>
