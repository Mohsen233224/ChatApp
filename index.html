<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#075e54">

<title>Mivo Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --green:#075e54;
    --green2:#128c7e;
    --light-green:#25d366;
    --bg:#0b141a;
    --panel:#111b21;
    --panel2:#202c33;
    --border:#26343b;
    --text:#e9edef;
    --muted:#8696a0;
    --incoming:#202c33;
    --outgoing:#005c4b;
    --danger:#ef5350;
}

body{
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    background:#000;
    color:var(--text);
    min-height:100vh;
    overflow:hidden;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   AUTH
========================= */

#authPage{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#174e45 0,#0b141a 40%,#000 100%);
}

.auth-box{
    width:100%;
    max-width:420px;
    background:rgba(17,27,33,.96);
    border:1px solid #26343b;
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.logo{
    width:74px;
    height:74px;
    margin:0 auto 14px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--green2);
    font-size:36px;
}

.auth-box h1{
    text-align:center;
    font-size:27px;
    margin-bottom:6px;
}

.auth-subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.tabs{
    display:flex;
    background:#202c33;
    border-radius:13px;
    padding:4px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    background:transparent;
    color:#aebac1;
    padding:11px;
    border-radius:10px;
}

.tab.active{
    background:var(--green2);
    color:#fff;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:#b7c2c8;
    font-size:13px;
    margin-bottom:7px;
}

.field input{
    width:100%;
    background:#202c33;
    border:1px solid #304047;
    color:#fff;
    padding:14px;
    border-radius:12px;
    outline:none;
}

.field input:focus{
    border-color:#128c7e;
}

.username-wrap{
    position:relative;
}

.username-wrap span{
    position:absolute;
    right:13px;
    top:14px;
    color:#8696a0;
}

.username-wrap input{
    padding-right:35px;
}

.main-btn{
    width:100%;
    background:var(--light-green);
    color:#001b14;
    padding:14px;
    border-radius:13px;
    font-weight:800;
    margin-top:6px;
}

.main-btn:active{
    transform:scale(.98);
}

.auth-error{
    color:#ff8a80;
    background:rgba(239,83,80,.1);
    border:1px solid rgba(239,83,80,.3);
    padding:11px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:12px;
}

/* =========================
   APP
========================= */

#app{
    width:100%;
    height:100vh;
    display:flex;
    background:#111b21;
}

.sidebar{
    width:390px;
    max-width:100%;
    height:100%;
    background:#111b21;
    border-left:1px solid #26343b;
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:3;
}

.sidebar-header{
    min-height:65px;
    background:#202c33;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
}

.profile-mini{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.avatar{
    width:45px;
    height:45px;
    flex-shrink:0;
    border-radius:50%;
    background:
        linear-gradient(135deg,#128c7e,#25d366);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:700;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-username{
    color:var(--muted);
    font-size:12px;
}

.header-actions{
    display:flex;
    gap:4px;
}

.icon-btn{
    width:42px;
    height:42px;
    background:transparent;
    color:#aebac1;
    border-radius:50%;
    font-size:21px;
}

.icon-btn:active{
    background:#2a3942;
}

.search-box{
    padding:9px 12px;
    background:#111b21;
}

.search-input{
    width:100%;
    background:#202c33;
    border:0;
    outline:none;
    color:#fff;
    padding:12px 15px;
    border-radius:9px;
}

.search-results{
    position:absolute;
    top:118px;
    left:10px;
    right:10px;
    background:#202c33;
    border-radius:12px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
    overflow:hidden;
    z-index:20;
}

.search-result{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-bottom:1px solid #2b3a41;
    cursor:pointer;
}

.search-result:last-child{
    border-bottom:0;
}

.search-result-info{
    flex:1;
}

.search-result-name{
    font-weight:700;
}

.search-result-username{
    color:var(--muted);
    font-size:12px;
}

.chat-list{
    flex:1;
    overflow-y:auto;
}

.empty-list{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.chat-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-bottom:1px solid rgba(134,150,160,.08);
    cursor:pointer;
}

.chat-item:hover{
    background:#202c33;
}

.chat-info{
    flex:1;
    min-width:0;
}

.chat-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.chat-name{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-time{
    color:var(--muted);
    font-size:11px;
    white-space:nowrap;
}

.chat-preview{
    color:var(--muted);
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:4px;
}

/* =========================
   CHAT
========================= */

.chat-area{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    min-width:0;
    background:#0b141a;
}

.chat-placeholder{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    padding:30px;
}

.chat-placeholder-icon{
    font-size:65px;
    margin-bottom:15px;
}

.chat-header{
    height:65px;
    flex-shrink:0;
    background:#202c33;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
}

.back-btn{
    display:none;
}

.chat-header-info{
    flex:1;
    min-width:0;
}

.chat-header-name{
    font-weight:700;
}

.chat-header-status{
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px 7%;
    background-color:#0b141a;
    background-image:
        radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:18px 18px;
}

.message-row{
    display:flex;
    margin-bottom:5px;
}

.message-row.mine{
    justify-content:flex-start;
}

.message-row.theirs{
    justify-content:flex-end;
}

.message{
    max-width:min(75%,500px);
    padding:7px 10px 6px;
    border-radius:8px;
    position:relative;
    word-break:break-word;
    box-shadow:0 1px 1px rgba(0,0,0,.15);
}

.message.mine{
    background:var(--outgoing);
    border-top-right-radius:2px;
}

.message.theirs{
    background:var(--incoming);
    border-top-left-radius:2px;
}

.message-text{
    font-size:14px;
    line-height:1.55;
    white-space:pre-wrap;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    color:#9eb4ac;
    font-size:10px;
    margin-top:2px;
}

.message-status{
    color:#53bdeb;
}

.chat-input-area{
    min-height:65px;
    background:#202c33;
    padding:9px;
    display:flex;
    align-items:center;
    gap:8px;
}

.message-input{
    flex:1;
    border:0;
    outline:none;
    resize:none;
    background:#2a3942;
    color:#fff;
    border-radius:22px;
    padding:12px 16px;
    min-height:45px;
    max-height:120px;
}

.send-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#00a884;
    color:white;
    font-size:20px;
}

/* =========================
   SETTINGS
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal{
    width:100%;
    max-width:430px;
    background:#202c33;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 80px rgba(0,0,0,.7);
}

.modal-header{
    padding:17px;
    font-size:18px;
    font-weight:700;
    border-bottom:1px solid #33434b;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-body{
    padding:18px;
}

.modal-row{
    margin-bottom:14px;
}

.modal-label{
    color:var(--muted);
    font-size:12px;
    margin-bottom:5px;
}

.modal-value{
    word-break:break-all;
}

.modal-actions{
    display:flex;
    gap:8px;
}

.secondary-btn{
    flex:1;
    background:#2a3942;
    color:#fff;
    padding:12px;
    border-radius:10px;
}

.danger-btn{
    flex:1;
    background:#8b2424;
    color:#fff;
    padding:12px;
    border-radius:10px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(30px);
    background:#202c33;
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
    font-size:13px;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    background:#0b141a;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
}

.spinner{
    width:45px;
    height:45px;
    border:4px solid #304047;
    border-top-color:#25d366;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .sidebar{
        width:100%;
    }

    .chat-area{
        position:fixed;
        inset:0;
        z-index:10;
        transform:translateX(100%);
        transition:.25s;
    }

    body.chat-open .chat-area{
        transform:translateX(0);
    }

    .back-btn{
        display:block;
    }

    .messages{
        padding:12px 3%;
    }

    .message{
        max-width:84%;
    }

    .sidebar{
        border:0;
    }

    body.chat-open .sidebar{
        display:none;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">
    <div class="spinner"></div>
    <div>جاري تشغيل Mivo Chat...</div>
</div>

<!-- =========================
     AUTH PAGE
========================= -->

<section id="authPage" class="hidden">

    <div class="auth-box">

        <div class="logo">💬</div>

        <h1>Mivo Chat</h1>

        <div class="auth-subtitle">
            محادثات فورية بين المستخدمين
        </div>

        <div class="tabs">
            <button id="loginTab" class="tab active">

        </div>

                <input

            </div>

            <div class="field">
                <label>كلمة المرور</label>
                <input
                    id="loginPassword"

            <button id="loginBtn" class="main-btn">
                تسجيل الدخول
            </button>

        </div>

        <!-- REGISTER -->

            <div class="field">

            <div class="field">

            <button id="registerBtn" class="main-btn">

    </div>

</section>

<!-- =========================
     APP
========================= -->

<section id="app" class="hidden">

    <aside class="sidebar">

                </div>

            </div>

            <div class="header-actions">

                <button
                    id="logoutBtn"
                    class="icon-btn"

                    🚪
                </button>

            </div>

        </header>

        <div class="search-box">

            <input
                id="userSearch"
                class="search-input"
                type="text"

            <div
                id="searchResults"

            </div>

        </div>

        <div id="chatList" class="chat-list">

            <div class="empty-list">

            </div>

        </div>

    </aside>

    <!-- CHAT -->

    <main class="chat-area">

        <div id="chatPlaceholder" class="chat-placeholder">

            <div>

                <div class="chat-placeholder-icon">
                    💬
                </div>

                <h2 style="margin-bottom:8px">
                    Mivo Chat
                </h2>

                <p>
                    اختر محادثة أو ابحث عن مستخدم لبدء الدردشة.
                </p>

            </div>

        </div>

        <div id="chatContent" class="hidden"
             style="height:100%;display:flex;flex-direction:column;">

            <header class="chat-header">

                <button

                    ←
                </button>

                <div id="chatAvatar" class="avatar">
                    👤
                </div>

                <div class="chat-header-info">

                    <div id="chatName"
                         class="chat-header-name">
                        المستخدم
                    </div>

                    <div id="chatStatus"
                         class="chat-header-status">
                        متصل
                    </div>

                </div>

            </header>

            <div id="messages"
                 class="messages">
            </div>

            <div class="chat-input-area">

                <textarea
                    id="messageInput"
                    class="message-input"

                <button
                    id="sendBtn"
                    class="send-btn">
                    ➤

            </div>

        </div>

    </main>

</section>

<!-- =========================
     SETTINGS MODAL
========================= -->

<div id="settingsOverlay"
     class="overlay hidden">

    <div class="modal">

        <div class="modal-header">

            <span>
                إعدادات الحساب
            </span>

            <button
                id="closeSettings"
                class="icon-btn">
                ✕
            </button>

        </div>

        <div class="modal-body">

            <div class="modal-row">

                <div class="modal-label">
                    الاسم
                </div>

                <div id="settingsName"
                     class="modal-value">
                </div>

            </div>

            <div class="modal-row">

                <div class="modal-label">
                    المعرف
                </div>

                <div id="settingsUsername"
                     class="modal-value">
                </div>

            </div>

            <div class="modal-row">

                <div class="modal-label">
                    البريد
                </div>

                <div id="settingsEmail"
                     class="modal-value">
                </div>

            </div>

            <div class="modal-row">

                <div class="modal-label">
                    UID
                </div>

                <div id="settingsUid"
                     class="modal-value">
                </div>

            </div>

            <div class="modal-actions">

                <button
                    id="copyUidBtn"
                    class="secondary-btn">
                    نسخ UID
                </button>

                <button
                    id="closeSettings2"
                    class="secondary-btn">
                    إغلاق
                </button>

            </div>

        </div>

    </div>

</div>

<div id="toast"></div>

/* =========================================================
   HELPERS
========================================================= */

function showToast(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
        setTimeout(() => {
            toast.classList.remove("show");
        }, 2500);
}


function showAuthError(text){

    authError.textContent = text;

    authError.classList.remove("hidden");
}


function hideAuthError(){

    authError.textContent = "";

    authError.classList.add("hidden");
}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function normalizeUsername(value){

    return String(value || "")
        .trim()
        .replace(/^@/,"")
        .toLowerCase()
        .replace(/[^a-z0-9_.-]/g,"");
}


function conversationIdFor(uid1,uid2){

    return [uid1,uid2]
        .sort()
        .join("_");
}


function formatTime(timestamp){

    if(!timestamp){
        return "";
    }

    try{

        const date =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);

        return date.toLocaleTimeString(
            "ar-SA",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch{

        return "";
    }
}

/* =========================================================
   REGISTER
========================================================= */

registerUsername.addEventListener("input",() => {

    registerUsername.value =
        normalizeUsername(registerUsername.value);
});


registerBtn.addEventListener("click",register);


async function register(){

    hideAuthError();

    const name =
        registerName.value.trim();

    const username =
        normalizeUsername(
            registerUsername.value
        );

    const email =
        registerEmail.value.trim();

    const password =
        registerPassword.value;


    if(name.length < 2){

        showAuthError(
            "اكتب اسمك بشكل صحيح."
        );

        return;
    }


    if(username.length < 3){

        showAuthError(
            "المعرف يجب أن يكون 3 أحرف على الأقل."
        );

        return;
    }


    if(!/^[a-z0-9_.-]+$/.test(username)){

        showAuthError(
            "المعرف يجب أن يحتوي على أحرف إنجليزية وأرقام فقط."
        );

        return;
    }


    if(!email){

        showAuthError(
            "اكتب البريد الإلكتروني."
        );

        return;
    }


    if(password.length < 6){

        showAuthError(
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
        );

        return;
    }


    registerBtn.disabled = true;

    registerBtn.textContent =
        "جاري إنشاء الحساب...";


    let createdUser = null;


    try{

        /*
         * أولاً ننشئ حساب Firebase Authentication.
         */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        createdUser =
            credential.user;


        const uid =
            createdUser.uid;


        /*
         * نحجز username داخل Transaction.
         *
         * هذا يمنع مستخدمين من استخدام
         * نفس المعرف في نفس الوقت.
         */

        await runTransaction(
            db,
            async(transaction) => {

                const usernameRef =
                    doc(
                        db,
                        "usernames",
                        username
                    );

                const userRef =
                    doc(
                        db,
                        "users",
                        uid
                    );


                const usernameSnap =
                    await transaction.get(
                        usernameRef
                    );


                if(usernameSnap.exists()){

                    throw new Error(
                        "USERNAME_ALREADY_EXISTS"
                    );
                }


                transaction.set(
                    usernameRef,
                    {
                        username,
                        uid,
                        createdAt:
                            serverTimestamp()
                    }
                );


                transaction.set(
                    userRef,
                    {
                        uid,
                        name,
                        username,
                        email,
                        createdAt:
                            serverTimestamp(),
                        updatedAt:
                            serverTimestamp()
                    }
                );

            }
        );


        showToast(
            "تم إنشاء الحساب بنجاح"
        );


    }catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );


        /*
         * إذا فشل حجز username
         * نحاول حذف حساب Auth الذي أنشئناه.
         */

        if(
            createdUser &&
            error.message ===
            "USERNAME_ALREADY_EXISTS"
        ){

            try{
                await deleteUser(
                    createdUser
                );
            }catch(deleteError){
                console.error(
                    deleteError
                );
            }

            showAuthError(
                "هذا المعرف مستخدم بالفعل. اختر معرفاً آخر."
            );

            return;
        }


        showAuthError(
            firebaseErrorMessage(error)
        );

    }finally{

        registerBtn.disabled = false;

        registerBtn.textContent =
            "إنشاء الحساب";
    }
}

/* =========================================================
   FIREBASE ERROR TRANSLATION
========================================================= */

function firebaseErrorMessage(error){

    const code =
        error?.code || "";

    const message =
        error?.message || "";


    if(code === "auth/invalid-credential"){
        return "البريد أو كلمة المرور غير صحيحة.";
    }

    if(code === "auth/invalid-email"){
        return "البريد الإلكتروني غير صحيح.";
    }

    if(code === "auth/email-already-in-use"){
        return "البريد الإلكتروني مستخدم بالفعل.";
    }

    if(code === "auth/weak-password"){
        return "كلمة المرور ضعيفة.";
    }

    if(code === "auth/network-request-failed"){
        return "تأكد من اتصال الإنترنت.";
    }

    if(code === "permission-denied"){
        return "Firebase Firestore رفض العملية. تحقق من Rules.";
    }

    if(
        message.includes(
            "Missing or insufficient permissions"
        )
    ){
        return "لا توجد صلاحيات كافية في Firestore Rules.";
    }

    return message || "حدث خطأ غير معروف.";
}

    async(user) => {

        );


        /*

         */

            currentProfile = null;

            stopChatListener();

            stopMessageListener();

            currentChatUser = null;

            appPage.classList.add("hidden");

            authPage.classList.remove("hidden");

            loading.classList.add("hidden");

            return;
        }


        /*
         * يوجد مستخدم.
         */

        currentUser = user;


        try{

            await loadMyProfile();

            authPage.classList.add("hidden");

            appPage.classList.remove("hidden");

            loading.classList.add("hidden");


            /*
             * الآن فقط نبدأ مستمع المحادثات.
             */

            startChatListener(user);


        }catch(error){

            console.error(
                "AUTH INITIALIZATION ERROR:",
                error
            );

            loading.classList.add("hidden");

            showToast(
                firebaseErrorMessage(error)
            );
        }

    }
);


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadMyProfile(){

    /*
     * حماية إضافية.
     */

    if(!currentUser){

        throw new Error(
            "NO_AUTH_USER"
        );
    }


    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );


    const snap =
        await getDoc(userRef);


    if(!snap.exists()){

        /*
         * حساب Auth موجود ولكن ملف Firestore
         * غير موجود.
         */

        currentProfile = {

            uid:
                currentUser.uid,

            name:
                currentUser.email
                    ?.split("@")[0] ||
                "مستخدم",

            username:
                currentUser.uid
                    .slice(0,8),

            email:
                currentUser.email || ""

        };


        await setDoc(
            userRef,
            {
                ...currentProfile,
                createdAt:
                    serverTimestamp(),
                updatedAt:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );

    }else{

        currentProfile =
            snap.data();

    }


    updateMyProfileUI();
}

function setAvatar(element,profile){

    if(!element){
        return;
    }


    /*
     * إذا أضفت لاحقاً photoURL
     * سيستخدم الصورة تلقائياً.
     */

    if(profile?.photoURL){

        element.innerHTML =
            `<img src="${escapeHTML(profile.photoURL)}"
                  alt="">`;

        return;
    }


    const first =
        (
            profile?.name ||
            "👤"
        ).trim().charAt(0);


    element.textContent =
        first || "👤";
}


/* =========================================================
   CHAT LIST
========================================================= */

function startChatListener(user){

    /*
     * إصلاح الخطأ الأساسي:
     */

    if(!user || !user.uid){

        console.warn(
            "startChatListener: no authenticated user"
        );

        return;
    }


    /*
     * إيقاف listener القديم.
     */

    stopChatListener();


    const uid =
        user.uid;


    console.log(
        "Starting chat listener:",
        uid
    );


    const conversationsRef =
        collection(
            db,
            "conversations"
        );


    /*
     * لا نستخدم orderBy هنا.
     *
     * حتى لا نحتاج Composite Index.
     */

    const q =
        query(
            conversationsRef,
            where(
                "memberIds",
                "array-contains",
                uid
            )
        );


    unsubscribeChats =
        onSnapshot(
            q,
            (snapshot) => {

                const chats = [];


                snapshot.forEach(
                    docSnap => {

                        chats.push({

                            id:
                                docSnap.id,

                            ...docSnap.data()

                        });

                    }
                );


                /*
                 * ترتيب محلي.
                 */

                chats.sort(
                    (a,b) => {

                        const aTime =
                            a.updatedAt?.toMillis?.() ||
                            0;

                        const bTime =
                            b.updatedAt?.toMillis?.() ||
                            0;

                        return bTime - aTime;
                    }
                );


                renderChatList(
                    chats
                );

            },
            (error) => {

                console.error(
                    "CHAT LIST ERROR:",
                    error
                );


                if(
                    error.code ===
                    "permission-denied"
                ){

                    showToast(
                        "Firestore Rules تمنع قراءة المحادثات."
                    );

                }

            }
        );
}


function stopChatListener(){

    if(unsubscribeChats){

        unsubscribeChats();

        unsubscribeChats = null;
    }
}


/* =========================================================
   RENDER CHAT LIST
========================================================= */

function renderChatList(chats){

    if(!chats.length){

        chatList.innerHTML = `

            <div class="empty-list">

                لا توجد محادثات بعد.<br>

                ابحث عن مستخدم بالمعرف
                لبدء محادثة.

            </div>

        `;

        return;
    }


    chatList.innerHTML = "";


    chats.forEach(
        chat => {

            const memberIds =
                Array.isArray(chat.memberIds)
                    ? chat.memberIds
                    : [];


            const otherUid =
                memberIds.find(
                    id =>
                        id !== currentUser?.uid
                );


            if(!otherUid){
                return;
            }


            loadUserForChatItem(
                chat,
                otherUid
            );

        }
    );
}


async function loadUserForChatItem(
    chat,
    otherUid
){

    try{

        const userSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    otherUid
                )
            );


        if(!userSnap.exists()){
            return;
        }


        const user =
            userSnap.data();


        const item =
            document.createElement("div");


        item.className =
            "chat-item";


        item.innerHTML = `

            <div class="avatar">
                ${user.photoURL
                    ? `<img src="${escapeHTML(user.photoURL)}">`
                    : escapeHTML(
                        (
                            user.name ||
                            "👤"
                        ).charAt(0)
                    )
                }
            </div>

            <div class="chat-info">

                <div class="chat-top">

                    <div class="chat-name">
                        ${escapeHTML(
                            user.name ||
                            "مستخدم"
                        )}
                    </div>

                    <div class="chat-time">
                        ${formatTime(
                            chat.updatedAt
                        )}
                    </div>

                </div>

                <div class="chat-preview">

                    ${
                        chat.lastSenderId === currentUser?.uid
                            ? "أنت: "
                            : ""
                    }

                    ${escapeHTML(
                        chat.lastMessage ||
                        "ابدأ المحادثة"
                    )}

                </div>

            </div>
        `;


        item.addEventListener(
            "click",
            () => {

                openChat(
                    user
                );

            }
        );


        chatList.appendChild(
            item
        );


    }catch(error){

        console.error(
            "CHAT USER ERROR:",
            error
        );
    }
}

            userSearch.value

            "hidden"

        return;
    }


    if(
        currentProfile?.username ===
        username
    ){

        searchResults.classList.add(
            "hidden"
        );

        return;
    }


    try{

        const usernameRef =
            doc(
                db,
                "usernames",
                username

            await getDoc(
                usernameRef
            );


        if(!usernameSnap.exists()){

            searchResults.innerHTML = `

                    <div class="avatar">
                        ❌

                            @${escapeHTML(username)}
                        </div>

            `;

                "hidden"
            );

            return;
        }


        const usernameData =
            usernameSnap.data();


        const uid =
            usernameData.uid;


        const userSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    uid
                )
            );


        if(!userSnap.exists()){

            return;
        }


        const user =
            userSnap.data();

            <div class="search-result"
                 id="foundUser">

                <div class="avatar">

                    ${
                        user.photoURL
                            ? `<img src="${escapeHTML(user.photoURL)}">`
                            : escapeHTML(
                                (
                                    user.name ||
                                    "👤"
                                ).charAt(0)
                            )

                <div class="search-result-info">

                    <div class="search-result-name">

                        ${escapeHTML(
                            user.name ||
                            "مستخدم"
                        )}

                    </div>

                    <div class="search-result-username">

                        @${escapeHTML(
                            user.username
                        )}

                    </div>

                </div>

            </div>

        `;


        searchResults.classList.remove(
            "hidden"
        );


        document

                () => {

                    openChat(user);

                    userSearch.value = "";

                    searchResults.classList.add(
                        "hidden"
                    );

            );


    }catch(error){

        console.error(

            error.code ===
            "permission-denied"
        ){

            showToast(
                "لا توجد صلاحية للبحث. تحقق من Firestore Rules."
            );
        }
    }
}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(user){

    /*
     * حماية مهمة.
     */

    if(!currentUser){

        showToast(
            "انتظر حتى يتم تسجيل الدخول."
        );

        return;
    }


    if(!user || !user.uid){

        showToast(
            "بيانات المستخدم غير صحيحة."
        );

        return;
    }


    if(
        user.uid ===
        currentUser.uid
    ){

        showToast(
            "لا يمكنك فتح محادثة مع نفسك."
        );

        return;
    }


    currentChatUser =
        user;


    currentConversationId =
        conversationIdFor(
            currentUser.uid,
            user.uid
        );


    chatPlaceholder.classList.add(
        "hidden"
    );


    chatContent.classList.remove(
        "hidden"
    );


    document.body.classList.add(
        "chat-open"
    );


    chatName.textContent =
        user.name ||
        "مستخدم";


    chatStatus.textContent =
        "@" +
        (
            user.username ||
            ""
        );


    setAvatar(
        chatAvatar,
        user
    );


    messages.innerHTML = "";


    startMessageListener();


    setTimeout(
        () => {
            messageInput.focus();
        },
        100
    );
}


/* =========================================================
   MESSAGE LISTENER
========================================================= */

function startMessageListener(){

    stopMessageListener();


    if(
        !currentUser ||
        !currentChatUser ||
        !currentConversationId
    ){

        return;
    }


    const messagesRef =
        collection(
            db,
            "conversations",
            currentConversationId,
            "messages"
        );


    /*
     * لا نستخدم orderBy.
     * سيتم الترتيب محلياً.
     */

    const q =
        query(
            messagesRef
        );


    unsubscribeMessages =
        onSnapshot(
            q,
            snapshot => {

                const list = [];


                snapshot.forEach(
                    docSnap => {

                        list.push({

                            id:
                                docSnap.id,

                            ...docSnap.data()

                        });

                    }
                );


                list.sort(
                    (a,b) => {

                        const aTime =
                            a.createdAt?.toMillis?.() ||
                            0;

                        const bTime =
                            b.createdAt?.toMillis?.() ||
                            0;

                        return aTime - bTime;
                    }
                );


                renderMessages(
                    list
                );

            },
            error => {

                console.error(
                    "MESSAGES ERROR:",
                    error
                );


                if(
                    error.code ===
                    "permission-denied"
                ){

                    showToast(
                        "لا توجد صلاحية لقراءة الرسائل."
                    );
                }
            }
        );
}


function stopMessageListener(){

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;
    }
}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(list){

    messages.innerHTML = "";


    if(!list.length){

        messages.innerHTML = `

            <div style="
                text-align:center;
                color:#8696a0;
                padding:40px 10px;
                font-size:13px;
            ">

                لا توجد رسائل بعد.<br>
                أرسل أول رسالة 👋

            </div>

        `;

        return;
    }


    list.forEach(
        message => {

            const mine =
                message.senderId ===
                currentUser?.uid;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    mine
                        ? "mine"
                        : "theirs"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message " +
                (
                    mine
                        ? "mine"
                        : "theirs"
                );


            bubble.innerHTML = `

                <div class="message-text">

                    ${escapeHTML(
                        message.text
                    )}

                </div>

                <div class="message-meta">

                    ${formatTime(
                        message.createdAt
                    )}

                    ${
                        mine
                            ? `<span class="message-status">✓✓</span>`
                            : ""
                    }

                </div>

            `;


            row.appendChild(
                bubble
            );


            messages.appendChild(
                row
            );

        }
    );


    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }

    }
);


async function sendMessage(){

    if(!currentUser){

        showToast(
            "لم يتم تسجيل الدخول."
        );

        return;
    }


    if(!currentChatUser){

        showToast(
            "اختر مستخدماً أولاً."
        );

        return;
    }


    const text =
        messageInput.value.trim();


    if(!text){
        return;
    }


    if(text.length > 5000){

        showToast(
            "الرسالة طويلة جداً."
        );

        return;
    }


    const conversationId =
        currentConversationId;


    if(!conversationId){

        return;
    }


    sendBtn.disabled = true;


    try{

        /*
         * إنشاء/تحديث المحادثة.
         */

        const conversationRef =
            doc(
                db,
                "conversations",
                conversationId
            );


        const conversationSnap =
            await getDoc(
                conversationRef
            );


        if(!conversationSnap.exists()){

            await setDoc(
                conversationRef,
                {

                    memberIds:[
                        currentUser.uid,
                        currentChatUser.uid
                    ],

                    lastMessage:
                        text,

                    lastSenderId:
                        currentUser.uid,

                    updatedAt:
                        serverTimestamp(),

                    createdAt:
                        serverTimestamp()

                }
            );

        }else{

            await setDoc(
                conversationRef,
                {

                    lastMessage:
                        text,

                    lastSenderId:
                        currentUser.uid,

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge:true
                }
            );
        }


        /*
         * إضافة الرسالة.
         */

        await addDoc(
            collection(
                db,
                "conversations",
                conversationId,
                "messages"
            ),
            {

                senderId:
                    currentUser.uid,

                receiverId:
                    currentChatUser.uid,

                text,

                createdAt:
                    serverTimestamp()

            }
        );


        messageInput.value = "";

        messageInput.style.height =
            "45px";


    }catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        if(
            error.code ===
            "permission-denied"
        ){

            showToast(
                "Firestore رفض إرسال الرسالة. تحقق من Rules."
            );

        }else{

            showToast(
                firebaseErrorMessage(error)
            );
        }

    }finally{

        sendBtn.disabled = false;
    }
}


/* =========================================================

========================================================= */

messageInput.addEventListener(

    () => {

        messageInput.style.height =

        messageInput.style.height =

    }
);
